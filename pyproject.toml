[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "DataAuditKit"
version = "0.2.0"
description = "Automatic Data Quality and EDA Toolkit"

authors = [
    {name = "Md. Naim Molla"}
]

dependencies = [
    "pandas>=1.5.3,<2.1",
    "numpy>=1.24.4,<2.0",
    "matplotlib>=3.7,<3.9",
    "jinja2>=3.1,<4.0"
]

requires-python = ">=3.8"

[tool.setuptools]
packages = ["dataauditkit"]
package-data = {"dataauditkit" = ["*.html"]}

[project.scripts]
dataauditkit = "dataauditkit.cli:main"